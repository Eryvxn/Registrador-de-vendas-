<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Artico Sorvetes - Controle de Vendas</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<header>
  <div class="header-inner">
    <span class="header-icon">🍦</span>
    <h1>ARTICO SORVETES</h1>
    <span class="header-tagline">Controle de Vendas</span>
  </div>
</header>

<div class="container">

  <!-- COLUNA ESQUERDA -->
  <div class="col-left">

    <!-- REGISTRAR VENDA -->
    <section class="card">
      <div class="card-header">
        <span class="card-icon">🧾</span>
        <h2>Registrar Venda</h2>
      </div>

      <div class="field-group">
        <label for="cliente">Cliente</label>
        <input type="text" id="cliente" placeholder="Nome do cliente">
      </div>

      <div class="field-group">
        <label for="produto">Produto</label>
        <select id="produto">
          <optgroup label="🍨 Sorvetes">
            <option>Sorvete 10L</option>
            <option>Sorvete 5L</option>
            <option>Sorvete 1L</option>
            <option>Sorvete 200ML</option>
            <option>Sundae</option>
          </optgroup>
          <optgroup label="🫐 Açaí">
            <option>Açaí 10L</option>
            <option>Açaí 5L</option>
            <option>Açaí 1L</option>
          </optgroup>
          <optgroup label="🍡 Picolés">
            <option>Ao leite</option>
            <option>Skimo</option>
            <option>Paleta Mexicana</option>
          </optgroup>
        </select>
      </div>

      <div class="field-group">
        <label for="quantidade">Quantidade</label>
        <input type="number" id="quantidade" placeholder="0" min="1">
      </div>

      <button id="add" class="btn btn-primary">
        <span>＋</span> Adicionar ao Pedido
      </button>
    </section>

    <!-- CARRINHO -->
    <section class="card">
      <div class="card-header">
        <span class="card-icon">🛒</span>
        <h2>Carrinho</h2>
      </div>
      <div id="carrinho-lista" class="lista-interna"></div>
      <div class="total-box">
        <span>Total do pedido</span>
        <p id="total-carrinho">R$0</p>
      </div>
      <button id="registrar" class="btn btn-success">
        ✔ Finalizar Pedido
      </button>
    </section>

  </div>

  <!-- COLUNA DIREITA -->
  <div class="col-right">

    <!-- VENDAS DO MÊS -->
    <section class="card card-tall">
      <div class="card-header">
        <span class="card-icon">📊</span>
        <h2>Vendas do Mês</h2>
      </div>
      <div id="lista-vendas" class="lista-interna lista-scroll"></div>
      <div class="total-box destaque">
        <span>Total do mês</span>
        <h2 id="total">R$0</h2>
      </div>
      <button id="limpar" class="btn btn-danger">
        🧹 Limpar Tudo
      </button>
    </section>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
