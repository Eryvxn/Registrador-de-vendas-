<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Artico Sorvetes - Controle de Vendas</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>ARTICO SORVETES</h1>

<div class="container">

<h2>Controle de Vendas</h2>


<hr>

<h3>Registrar Venda</h3>

<label>Produto:</label>

<select id="produto">

<optgroup label="Sorvetes">
<option>Sorvete 10L</option>
<option>Sorvete 5L</option>
<option>Sorvete 1L</option>
<option>Sorvete 200ML</option>
<option>Sundae</option>
</optgroup>

<optgroup label="Açaí">
<option>Açaí 10L</option>
<option>Açaí 5L</option>
<option>Açaí 1L</option>
</optgroup>

<optgroup label="Picolés">
<option>Ao leite</option>
<option>Skimo</option>
<option>Paleta Mexicana</option>
</optgroup>

</select>

<br><br>

<label>Quantidade:</label>
<input type="number" id="quantidade">

<br><br>

<button id="registrar">Registrar Venda</button>

<hr>

<h3>Vendas do Mês</h3>

<div id="lista-vendas"></div>

<hr>

<h2 id="total">Total do Mês: R$0</h2>
<button id="limpar">🧹 Limpar Tudo</button>

</div>

<script src="script.js"></script>
</body>
</html>
